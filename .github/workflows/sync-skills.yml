name: Sync skills from portal-co

# Keeps this registry up-to-date with skills published in portal-co repos.
# The original repos remain the source of truth; this workflow provides
# discoverability, updatability, and centralization.
#
# Triggers:
#   • Weekly on Monday at 06:00 UTC (routine upstream sync)
#   • Manual dispatch (run now, optionally targeting one repo)
#   • Push to main that touches import-config.json (config-driven re-sync)
#
# Outcome: if any skills changed, an open sync PR on branch sync/skills is
# updated in place, or a new PR is opened against main. Nothing is pushed
# directly to the default branch.

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly — Monday 06:00 UTC

  workflow_dispatch:
    inputs:
      repo:
        description: 'Import a single repo (leave blank for all public repos)'
        required: false
        default: ''
      force:
        description: 'Overwrite locally modified files'
        required: false
        default: 'false'
        type: boolean

  push:
    branches: [main]
    paths:
      - 'import-config.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Bulk import skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          # Full history so we can detect locally modified files via git status
          fetch-depth: 0

      - name: Check sync action
        env:
          GH_TOKEN: ${{ secrets.SKILLS_IMPORT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/check-sync-action.sh

      - name: Import skills
        env:
          GH_TOKEN: ${{ secrets.SKILLS_IMPORT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [[ -n "${{ inputs.repo }}" ]]; then
            args+=("${{ inputs.repo }}")
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=("--force")
          fi
          bash scripts/import-skills.sh "${args[@]+"${args[@]}"}"

      - name: Detect changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — registry is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --staged --stat
          fi

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_REPO: ${{ inputs.repo }}
        run: |
          if [[ -n "$SYNC_REPO" ]]; then
            export SYNC_SCOPE="portal-co/${SYNC_REPO}"
          else
            export SYNC_SCOPE="all public portal-co repos"
          fi
          bash scripts/open-sync-pr.sh
